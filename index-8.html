<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>status</title>
<style>
:root{
  --bg:#070c16;
  --bg2:#0c1526;
  --line:#1c2c47;
  --blue:#4da3ff;
  --blue-dim:#25406b;
  --dim:#5b7099;
  --text:#dbe7fb;
  --red:#ff6b6b;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 25% -10%, rgba(77,163,255,0.12), transparent 45%);
  color:var(--text);
  font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px 40px;
}
.wrap{width:100%;max-width:420px;}
.panel{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:26px 22px;
  position:relative;
  overflow:hidden;
}
.panel::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(77,163,255,0.08), transparent 60%);
  pointer-events:none;
}
.label{
  font-size:11px;
  color:var(--dim);
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}
.statusline{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;
  background:var(--blue);
  box-shadow:0 0 10px var(--blue);
}
.statustext{
  font-size:24px;
  font-weight:600;
  letter-spacing:0.2px;
  word-break:break-word;
  color:var(--blue);
}
.desc{
  font-size:13px;
  color:var(--dim);
  line-height:1.5;
  border-top:1px dashed var(--line);
  padding-top:12px;
  margin-top:2px;
  display:none;
}
.meta{font-size:10.5px;color:#3a4a6b;margin-top:14px;}
.errbox{
  margin-top:12px;font-size:11.5px;color:var(--red);
  border-top:1px dashed var(--line);padding-top:10px;display:none;
}
button{
  width:100%;
  margin-top:18px;
  font-family:inherit;
  font-size:13px;
  padding:12px 10px;
  border-radius:8px;
  border:1px solid var(--blue-dim);
  background:linear-gradient(180deg, rgba(77,163,255,0.18), rgba(77,163,255,0.06));
  color:var(--blue);
  font-weight:600;
  cursor:pointer;
  transition:transform .12s ease;
}
button:active{transform:scale(0.97);}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion: no-preference){
  .statustext.flicker{animation:flick .4s ease;}
  @keyframes flick{0%{opacity:0.2}100%{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="label"><span>status</span><span id="fetchState">memuat...</span></div>
    <div class="statusline">
      <div class="dot"></div>
      <div class="statustext" id="statusText">LOADING...</div>
    </div>
    <div class="desc" id="statusDesc"></div>
    <div class="meta" id="meta"></div>
    <div class="errbox" id="errbox"></div>

    <button id="refreshBtn">refresh</button>
  </div>
</div>

<script>
const STATUS_URL = "/api/status";

const statusText = document.getElementById('statusText');
const statusDesc = document.getElementById('statusDesc');
const meta = document.getElementById('meta');
const errbox = document.getElementById('errbox');
const fetchState = document.getElementById('fetchState');

async function loadStatus(){
  fetchState.textContent = "memuat...";
  errbox.style.display = "none";
  try{
    const res = await fetch(STATUS_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    statusText.textContent = data.status || "UNKNOWN";
    statusText.classList.remove('flicker');
    requestAnimationFrame(()=>statusText.classList.add('flicker'));

    if(data.desc){
      statusDesc.textContent = data.desc;
      statusDesc.style.display = "block";
    } else {
      statusDesc.style.display = "none";
    }

    meta.textContent = data.updated ? ("last update: " + data.updated) : "";
    fetchState.textContent = "live";
  }catch(err){
    fetchState.textContent = "gagal";
    errbox.style.display = "block";
    errbox.textContent = "Gagal ambil status: " + err.message;
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadStatus);

loadStatus();
setInterval(loadStatus, 2000);
</script>
</body>
</html>
